<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cafeteria Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #222;
      color: white;
    }

    /* ---- BACKGROUND FLASH LAYER ---- */
    .bg-flash {
      position: fixed;
      inset: 0;
      z-index: 0;
      animation: bgpulse 1s infinite;
    }
    @keyframes bgpulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    /* ---- MAIN CONTENT ---- */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .label {
      font-size: 12vw;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 30px;
      text-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .sublabel {
      font-size: 3vw;
      font-weight: 400;
      opacity: 0.95;
      margin-bottom: 40px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .timer {
      font-size: 18vw;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .timer-small { font-size: 10vw; }

    /* ---- MESSAGE MODE ---- */
    .message-mode {
      font-size: 9vw;
      font-weight: 900;
      line-height: 1.15;
      padding: 0 40px;
      text-align: center;
      text-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    /* ---- LOUD OVERLAY ---- */
    .loud-overlay {
      position: fixed;
      inset: 0;
      background: #b00020;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: bgpulse 0.6s infinite;
    }
    .loud-overlay.show { display: flex; }
    .loud-overlay .icon { font-size: 20vw; margin-bottom: 20px; }
    .loud-overlay .text {
      font-size: 6vw;
      font-weight: 900;
      text-align: center;
      padding: 0 40px;
    }

    /* ---- PRE-START ---- */
    .prestart {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      cursor: pointer;
    }
    .prestart.hidden { display: none; }
    .prestart h1 { font-size: 4vw; margin-bottom: 20px; }
    .prestart p { font-size: 2vw; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="prestart" id="prestart">
    <h1>🖐️ Tap anywhere to begin</h1>
    <p>This enables sound and connects to the server.</p>
  </div>

  <div class="bg-flash" id="bgFlash"></div>

  <div class="container" id="container">
    <div class="label" id="label">Waiting…</div>
    <div class="sublabel" id="sublabel"></div>
    <div class="timer" id="timer">--</div>
  </div>

  <div class="loud-overlay" id="loudOverlay">
    <div class="icon">🔇</div>
    <div class="text">Please lower your voices</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const container = document.getElementById("container");
    const label = document.getElementById("label");
    const sublabel = document.getElementById("sublabel");
    const timer = document.getElementById("timer");
    const loudOverlay = document.getElementById("loudOverlay");
    const prestart = document.getElementById("prestart");
    const bgFlash = document.getElementById("bgFlash");

    let audioReady = false;
    let currentColor = "#222222";
    let backgroundOn = false;

    prestart.addEventListener("click", () => {
      audioReady = true;
      prestart.classList.add("hidden");
      ensureAudioCtx();
    });

    // ---- High-pitched ding (Web Audio API) ----
    let audioCtx = null;
    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playHighDing() {
      if (!audioReady) return;
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(2500, now);

      gain.gain.setValueAtTime(0.0, now);
      gain.gain.linearRampToValueAtTime(1.0, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playDing3Times() {
      playHighDing();
      setTimeout(playHighDing, 500);
      setTimeout(playHighDing, 1000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    // ---- Sequence display ----
    function showSequence(s) {
      label.textContent = s.label;
      sublabel.textContent = s.sublabel || "";

      if (s.phase === 4 || s.totalSeconds === 0) {
        timer.textContent = "";
      } else {
        timer.textContent = formatTime(Math.max(0, s.secondsLeft));
        timer.classList.toggle("timer-small", s.totalSeconds <= 60);
      }
    }

    // ---- Message display ----
    function showMessage(text) {
      container.innerHTML = '<div class="message-mode">' + text + '</div>';
    }

    socket.on("state", (s) => {
      // Background color + flashing layer
      const newColor = s.color || "#222222";
      if (newColor !== currentColor) {
        currentColor = newColor;
        bgFlash.style.backgroundColor = newColor;
      }

      // If a message is active, show it and ignore the normal sequence
      if (s.freeMessage) {
        showMessage(s.freeMessage);
      } else {
        // Restore the sequence UI if we were showing a message
        if (!container.querySelector("#label")) {
          container.innerHTML =
            '<div class="label" id="label"></div>' +
            '<div class="sublabel" id="sublabel"></div>' +
            '<div class="timer" id="timer"></div>';
          // Re-grab references
          const newLabel = document.getElementById("label");
          const newSublabel = document.getElementById("sublabel");
          const newTimer = document.getElementById("timer");
          newLabel.textContent = s.label;
          newSublabel.textContent = s.sublabel || "";
          if (s.phase === 4 || s.totalSeconds === 0) {
            newTimer.textContent = "";
          } else {
            newTimer.textContent = formatTime(Math.max(0, s.secondsLeft));
            newTimer.classList.toggle("timer-small", s.totalSeconds <= 60);
          }
        } else {
          document.getElementById("label").textContent = s.label;
          document.getElementById("sublabel").textContent = s.sublabel || "";
          const t = document.getElementById("timer");
          if (s.phase === 4 || s.totalSeconds === 0) {
            t.textContent = "";
          } else {
            t.textContent = formatTime(Math.max(0, s.secondsLeft));
            t.classList.toggle("timer-small", s.totalSeconds <= 60);
          }
        }
      }

      // Background flash only while the sequence is running and not paused.
      const shouldFlash = s.running && !s.paused && s.phase !== 4;
      if (shouldFlash && !backgroundOn) {
        bgFlash.style.animationPlayState = "running";
        bgFlash.style.opacity = "1";
        backgroundOn = true;
      } else if (!shouldFlash && backgroundOn) {
        bgFlash.style.animationPlayState = "paused";
        bgFlash.style.opacity = "0.85";
        backgroundOn = false;
      }

      // Loud overlay
      if (s.loudMessageActive) {
        loudOverlay.classList.add("show");
      } else {
        loudOverlay.classList.remove("show");
      }
    });

    // Ding on every transition
    socket.on("transition", () => {
      playHighDing();
    });

    // Ding ×3 for loud message
    socket.on("loud", () => {
      playDing3Times();
      loudOverlay.classList.add("show");
    });

    // Ding ×7 (button triggered)
    socket.on("dingSeven", () => {
      for (let i = 0; i < 7; i++) {
        setTimeout(playHighDing, i * 320);
      }
    });
  </script>
</body>
</html>
