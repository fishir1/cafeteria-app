<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cafeteria Screen</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cafeteria" />
  <meta name="theme-color" content="#0f2a3a" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #222;
      color: white;
    }

    /* ---- Corner logo (small, top-left, links home) ---- */
    .corner-logo {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 56px;
      height: 56px;
      border-radius: 12px;
      z-index: 200;
      cursor: pointer;
      opacity: 0.9;
      transition: transform 0.15s, opacity 0.15s;
    }
    .corner-logo:hover {
      transform: scale(1.08);
      opacity: 1;
    }

    .bg-flash {
      position: fixed;
      inset: 0;
      z-index: 0;
      animation: bgpulse 1s infinite;
    }
    @keyframes bgpulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .intense-flash {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 255, 255, 0.55);
    }
    .intense-flash.active {
      animation: intensePulse 0.35s infinite;
    }
    @keyframes intensePulse {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.55; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .label {
      font-size: 14vw;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 30px;
      text-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .sublabel {
      font-size: 3.5vw;
      font-weight: 400;
      opacity: 0.95;
      margin-bottom: 40px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .timer {
      font-size: 22vw;
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    .timer-small { font-size: 12vw; }

    .message-mode {
      font-size: 11vw;
      font-weight: 900;
      line-height: 1.15;
      padding: 0 40px;
      text-align: center;
      text-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .loud-overlay {
      position: fixed;
      inset: 0;
      background: #b00020;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: bgpulse 0.6s infinite;
    }
    .loud-overlay.show { display: flex; }
    .loud-overlay .icon { font-size: 20vw; margin-bottom: 20px; }
    .loud-overlay .text {
      font-size: 6vw;
      font-weight: 900;
      text-align: center;
      padding: 0 40px;
    }

    .prestart {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      cursor: pointer;
    }
    .prestart.hidden { display: none; }
    .prestart h1 { font-size: 4vw; margin-bottom: 20px; }
    .prestart p { font-size: 2vw; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="prestart" id="prestart">
    <h1>🖐️ Tap anywhere to begin</h1>
    <p>This enables sound and connects to the server.</p>
  </div>

  <a href="/" title="Home"><img src="/logo.png" alt="Home" class="corner-logo" /></a>

  <div class="bg-flash" id="bgFlash"></div>
  <div class="intense-flash" id="intenseFlash"></div>

  <div class="container" id="container">
    <div class="label" id="label">Waiting…</div>
    <div class="sublabel" id="sublabel"></div>
    <div class="timer" id="timer">--</div>
  </div>

  <div class="loud-overlay" id="loudOverlay">
    <div class="icon">🔇</div>
    <div class="text">Please lower your voices</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const container = document.getElementById("container");
    const loudOverlay = document.getElementById("loudOverlay");
    const prestart = document.getElementById("prestart");
    const bgFlash = document.getElementById("bgFlash");
    const intenseFlash = document.getElementById("intenseFlash");

    let audioReady = false;
    let currentColor = "#222222";
    let backgroundOn = false;
    let lastFreeMessage = null;

    prestart.addEventListener("click", () => {
      audioReady = true;
      prestart.classList.add("hidden");
      ensureAudioCtx();
    });

    let audioCtx = null;
    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playHighDing() {
      if (!audioReady) return;
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(2500, now);

      gain.gain.setValueAtTime(0.0, now);
      gain.gain.linearRampToValueAtTime(1.0, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playDing3Times() {
      playHighDing();
      setTimeout(playHighDing, 500);
      setTimeout(playHighDing, 1000);
    }

    function triggerIntenseFlash() {
      intenseFlash.classList.add("active");
      setTimeout(() => {
        intenseFlash.classList.remove("active");
      }, 5000);
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function showMessage(text) {
      container.innerHTML = '<div class="message-mode">' + text + '</div>';
    }

    function showSequence(s) {
      if (!container.querySelector("#label")) {
        container.innerHTML =
          '<div class="label" id="label"></div>' +
          '<div class="sublabel" id="sublabel"></div>' +
          '<div class="timer" id="timer"></div>';
      }
      const lbl = document.getElementById("label");
      const sub = document.getElementById("sublabel");
      const tim = document.getElementById("timer");

      lbl.textContent = s.label;
      sub.textContent = s.sublabel || "";

      if (s.phase === 4 || s.totalSeconds === 0) {
        tim.textContent = "";
      } else {
        tim.textContent = formatTime(Math.max(0, s.secondsLeft));
        tim.classList.toggle("timer-small", s.totalSeconds <= 60);
      }
    }

    socket.on("state", (s) => {
      const newColor = s.color || "#222222";
      if (newColor !== currentColor) {
        currentColor = newColor;
        bgFlash.style.backgroundColor = newColor;
      }

      const newMessage = s.freeMessage || null;
      if (newMessage && newMessage !== lastFreeMessage) {
        playDing3Times();
        triggerIntenseFlash();
      }
      lastFreeMessage = newMessage;

      if (s.freeMessage) {
        showMessage(s.freeMessage);
      } else {
        showSequence(s);
      }

      const shouldFlash = s.running && !s.paused && s.phase !== 4;
      if (shouldFlash && !backgroundOn) {
        bgFlash.style.animationPlayState = "running";
        bgFlash.style.opacity = "1";
        backgroundOn = true;
      } else if (!shouldFlash && backgroundOn) {
        bgFlash.style.animationPlayState = "paused";
        bgFlash.style.opacity = "0.85";
        backgroundOn = false;
      }

      if (s.loudMessageActive) {
        loudOverlay.classList.add("show");
      } else {
        loudOverlay.classList.remove("show");
      }
    });

    socket.on("transition", () => {
      playHighDing();
    });

    socket.on("loud", () => {
      playDing3Times();
      loudOverlay.classList.add("show");
    });

    socket.on("dingSeven", () => {
      for (let i = 0; i < 7; i++) {
        setTimeout(playHighDing, i * 320);
      }
    });
  </script>
    <script>
    // ============================================================
    // Auto version check — reloads the page if the server version
    // has changed since this page was loaded.
    // ============================================================
    (function () {
      const VERSION_ENDPOINT = "/version.txt";
      const CHECK_INTERVAL_MS = 30 * 1000;

      let loadedVersion = null;

      async function fetchVersion() {
        try {
          const res = await fetch(VERSION_ENDPOINT + "?t=" + Date.now(), {
            cache: "no-store",
          });
          if (!res.ok) return null;
          return (await res.text()).trim();
        } catch (e) {
          return null;
        }
      }

      async function checkOnce() {
        const v = await fetchVersion();
        if (!v) return;

        if (loadedVersion === null) {
          loadedVersion = v;
          return;
        }

        if (v !== loadedVersion) {
          loadedVersion = v;
          const url = new URL(window.location.href);
          url.searchParams.set("v", v);
          window.location.replace(url.toString());
        }
      }

      checkOnce();
      setInterval(checkOnce, CHECK_INTERVAL_MS);
    })();
  </script>
</body>
</html>
