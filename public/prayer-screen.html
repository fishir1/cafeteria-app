<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prayer Hall Screen</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cafeteria" />
  <meta name="theme-color" content="#0f2a3a" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --deep-green: #0f2a3a;
      --mid-green: #1a4055;
      --gold: #5dc1d1;
      --light-gold: #8fd4e0;
      --cream: #e6f4f7;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--deep-green);
      color: var(--cream);
    }

    .pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.06;
      background-image:
        radial-gradient(circle at 25% 25%, var(--gold) 1.5px, transparent 2px),
        radial-gradient(circle at 75% 75%, var(--gold) 1.5px, transparent 2px);
      background-size: 80px 80px;
      background-position: 0 0, 40px 40px;
      pointer-events: none;
    }

    .flash-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      background: var(--light-gold);
      transition: opacity 0.1s;
    }
    .flash-overlay.active {
      animation: intenseFlash 0.35s infinite;
    }
    @keyframes intenseFlash {
      0%, 100% { opacity: 0.0; }
      50% { opacity: 0.35; }
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .role-title {
      font-size: 4vw;
      font-weight: 600;
      letter-spacing: 6px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0.9;
    }

    .student-name {
      font-size: 14vw;
      font-weight: 900;
      line-height: 1;
      color: var(--cream);
      text-shadow: 0 8px 30px rgba(0,0,0,0.6);
      margin-bottom: 40px;
    }

    .class-label {
      font-size: 18vw;
      font-weight: 900;
      line-height: 1;
      color: var(--cream);
      text-shadow: 0 8px 30px rgba(0,0,0,0.6);
      margin-bottom: 30px;
    }

    .class-sublabel {
      font-size: 2.5vw;
      opacity: 0.85;
      color: var(--gold);
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    .class-timer {
      font-size: 12vw;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: var(--light-gold);
      text-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .end-message {
      font-size: 8vw;
      font-weight: 800;
      text-align: center;
      color: var(--cream);
      text-shadow: 0 8px 30px rgba(0,0,0,0.6);
      line-height: 1.2;
    }

    .message-mode {
      font-size: 9vw;
      font-weight: 900;
      line-height: 1.15;
      padding: 0 40px;
      text-align: center;
      color: var(--cream);
      text-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }

    .idle {
      font-size: 3vw;
      color: var(--gold);
      opacity: 0.7;
      letter-spacing: 3px;
    }

    /* ---- Voices Too Loud overlay ---- */
    .loud-overlay {
      position: fixed;
      inset: 0;
      background: #b00020;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: loudFlash 0.6s infinite;
    }
    .loud-overlay.show { display: flex; }
    .loud-overlay .icon { font-size: 20vw; margin-bottom: 20px; }
    .loud-overlay .text {
      font-size: 6vw;
      font-weight: 900;
      text-align: center;
      padding: 0 40px;
      color: #fff;
    }
    @keyframes loudFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .prestart {
      position: fixed;
      inset: 0;
      background: var(--deep-green);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 500;
      cursor: pointer;
    }
    .prestart.hidden { display: none; }
    .prestart h1 {
      font-size: 4vw;
      margin-bottom: 20px;
      color: var(--gold);
    }
    .prestart p {
      font-size: 2vw;
      opacity: 0.7;
      color: var(--cream);
    }
  </style>
</head>
<body>

  <div class="prestart" id="prestart">
    <h1>🕌 Tap anywhere to begin</h1>
    <p>This enables sound and connects to the server.</p>
  </div>

  <div class="pattern"></div>
  <div class="flash-overlay" id="flashOverlay"></div>

  <div class="content" id="content">
    <div class="idle" id="idle">Waiting for names…</div>
  </div>

  <div class="loud-overlay" id="loudOverlay">
    <div class="icon">🔇</div>
    <div class="text">Please lower your voices</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io("/prayer");

    const prestart = document.getElementById("prestart");
    const content = document.getElementById("content");
    const flashOverlay = document.getElementById("flashOverlay");
    const loudOverlay = document.getElementById("loudOverlay");

    let audioReady = false;

    prestart.addEventListener("click", () => {
      audioReady = true;
      prestart.classList.add("hidden");
      ensureAudioCtx();
    });

    let audioCtx = null;
    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioCtx;
    }

    function playHighDing() {
      if (!audioReady) return;
      const ctx = ensureAudioCtx();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(2500, now);

      gain.gain.setValueAtTime(0.0, now);
      gain.gain.linearRampToValueAtTime(1.0, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.5);
    }

    function playDing3Times() {
      playHighDing();
      setTimeout(playHighDing, 500);
      setTimeout(playHighDing, 1000);
    }

    function triggerIntenseFlash() {
      flashOverlay.classList.add("active");
      setTimeout(() => {
        flashOverlay.classList.remove("active");
      }, 5000);
    }

    function showIdle() {
      content.innerHTML = '<div class="idle">Waiting for names…</div>';
    }

    function showName(role, name) {
      const titles = { adhan: "Adhan", iqamah: "Iqamah", athkar: "Athkar" };
      const title = titles[role] || "";
      content.innerHTML =
        '<div class="role-title">' + title + '</div>' +
        '<div class="student-name">' + name + '</div>';
    }

    function showDismiss(label, sublabel, seconds) {
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      const timeStr = min + ":" + String(sec).padStart(2, "0");
      content.innerHTML =
        '<div class="class-sublabel">' + sublabel + '</div>' +
        '<div class="class-label">' + label + '</div>' +
        '<div class="class-timer">' + timeStr + '</div>';
    }

    function showEnd() {
      content.innerHTML =
        '<div class="end-message">Please return to classes quietly</div>';
    }

    function showMessage(text) {
      content.innerHTML = '<div class="message-mode">' + text + '</div>';
    }

    socket.on("connect", () => {
      console.log("Prayer screen connected");
    });

    socket.on("state", (s) => {
      // Free message overrides EVERYTHING until cleared
      if (s.freeMessage) {
        showMessage(s.freeMessage);
        return;
      }

      if (s.mode === "dismiss") {
        showDismiss(
          s.dismissLabel,
          s.dismissSublabel,
          Math.max(0, s.dismissSecondsLeft)
        );
      } else if (s.mode === "end") {
        showEnd();
      } else if (s.mode === "names" && s.activeName) {
        showName(s.activeName.role, s.activeName.name);
      } else {
        showIdle();
      }
    });

    socket.on("nameArrived", () => {
      playHighDing();
      triggerIntenseFlash();
    });

    socket.on("dismissTransition", () => {
      playHighDing();
      triggerIntenseFlash();
    });

    socket.on("dismissEnd", () => {
      playHighDing();
    });

    socket.on("dingSeven", () => {
      for (let i = 0; i < 7; i++) {
        setTimeout(playHighDing, i * 320);
      }
    });

    socket.on("loud", () => {
      playDing3Times();
      loudOverlay.classList.add("show");
    });

    // Loud overlay auto-dismiss (server clears the flag, but keep
    // a local fallback timer in case of missed events)
    socket.on("state", (s) => {
      if (!s.loudMessageActive) {
        loudOverlay.classList.remove("show");
      }
    });
  </script>
</body>
</html>
