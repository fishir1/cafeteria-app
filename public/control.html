<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cafeteria Control</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cafeteria" />
  <meta name="theme-color" content="#0f2a3a" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f2a3a;
      color: #e6f4f7;
      overflow-y: auto;
    }

    .header {
      padding: 16px;
      padding-left: 80px;
      text-align: center;
      background: #1a4055;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #2a7d8f;
    }
    .header h1 { font-size: 18px; font-weight: 800; letter-spacing: 1px; }
    .status {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 4px;
    }
    .status.connected { color: #5dc1d1; opacity: 1; }
    .status.disconnected { color: #ff6b6b; opacity: 1; }

    .corner-logo {
      position: fixed;
      top: 12px;
      left: 12px;
      width: 52px;
      height: 52px;
      border-radius: 12px;
      z-index: 200;
      cursor: pointer;
      opacity: 0.95;
      transition: transform 0.15s;
    }
    .corner-logo:hover { transform: scale(1.08); }

    .current {
      padding: 20px;
      text-align: center;
      background: #1a4055;
      border-bottom: 1px solid #2a7d8f;
    }
    .current .label { font-size: 28px; font-weight: 800; margin-bottom: 4px; }
    .current .sublabel { font-size: 13px; opacity: 0.7; margin-bottom: 10px; }
    .current .timer { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .current .phase { font-size: 12px; opacity: 0.6; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

    .section {
      padding: 16px;
      border-bottom: 1px solid #1a4055;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      margin-bottom: 10px;
    }

    .name-block {
      background: #1a4055;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .name-block .role {
      font-size: 14px;
      font-weight: 700;
      color: #5dc1d1;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .name-block .row {
      display: flex;
      gap: 8px;
    }

    .name-block input {
      flex: 1;
      font-family: inherit;
      font-size: 16px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a7d8f;
      background: #0f2a3a;
      color: #e6f4f7;
      outline: none;
      min-width: 0;
    }
    .name-block input:focus { border-color: #5dc1d1; }

    .name-block button {
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      background: #2a7d8f;
      color: #e6f4f7;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    .name-block button:active {
      transform: scale(0.96);
      background: #5dc1d1;
      color: #0f2a3a;
    }

    .buttons {
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button.control {
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 18px 12px;
      border: none;
      border-radius: 12px;
      color: #e6f4f7;
      background: #2a7d8f;
      cursor: pointer;
      min-height: 60px;
      user-select: none;
      transition: transform 0.1s;
    }
    button.control:active {
      transform: scale(0.96);
      background: #5dc1d1;
      color: #0f2a3a;
    }

    button.start { background: #2a7d8f; }
    button.next  { background: #2a7d8f; }
    button.pause { background: #3a6b7d; }
    button.reset { background: #7d3a3a; }
    button.clear { background: #4a4a4a; }
  </style>
</head>
<body>

  <a href="/" title="Home"><img src="/logo.png" alt="Home" class="corner-logo" /></a>

  <div class="header">
    <h1>🍽️ Cafeteria Control</h1>
    <div class="status" id="status">Connecting…</div>
  </div>

  <div class="current">
    <div class="label" id="label">—</div>
    <div class="sublabel" id="sublabel"></div>
    <div class="timer" id="timer">--</div>
    <div class="phase" id="phase"></div>
  </div>

  <div class="section">
    <div class="section-title">Free message to the screen</div>

    <div class="name-block">
      <div class="role">Message</div>
      <div class="row">
        <input type="text" id="inputMessage" placeholder="Type any message…" />
        <button id="btnSendMessage">Send</button>
      </div>
    </div>

    <button class="control start" id="btnShowSequence" style="width: 100%; margin-top: 8px;">
      ⬅️ Back to Sequence
    </button>
  </div>

  <div class="buttons">
    <div class="section-title" style="grid-column: 1/-1;">Main controls</div>
    <button class="control start" id="btnStart">▶️ Start</button>
    <button class="control pause" id="btnPause">⏸️ Pause</button>
    <button class="control next" id="btnNext">⏭️ Next</button>
    <button class="control reset" id="btnReset">🔄 Reset</button>

    <div class="section-title" style="grid-column: 1/-1;">Jump to phase</div>
    <button class="control start" id="btnQuiet">🕒 Quiet Time</button>
    <button class="control next" id="btnExit">🚪 Exit Phase</button>

    <div class="section-title" style="grid-column: 1/-1;">Attention</div>
    <button class="control reset" id="btnLoud" style="grid-column: 1/-1;">
      🔇 Voices Too Loud
    </button>
    <button class="control start" id="btnDing7" style="grid-column: 1/-1;">
      🔔 Ding ×7
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const status = document.getElementById("status");
    const label = document.getElementById("label");
    const sublabel = document.getElementById("sublabel");
    const timer = document.getElementById("timer");
    const phase = document.getElementById("phase");
    const inputMessage = document.getElementById("inputMessage");

    function send(cmd) {
      socket.emit("command", cmd);
      if (navigator.vibrate) navigator.vibrate(30);
    }

    document.getElementById("btnStart").addEventListener("click", () => send("start"));
    document.getElementById("btnPause").addEventListener("click", () => send("pause"));
    document.getElementById("btnNext").addEventListener("click", () => send("next"));
    document.getElementById("btnReset").addEventListener("click", () => {
      inputMessage.value = "";
      send("reset");
    });
    document.getElementById("btnQuiet").addEventListener("click", () => send("quiet"));
    document.getElementById("btnExit").addEventListener("click", () => send("exitPhase"));
    document.getElementById("btnLoud").addEventListener("click", () => send("loud"));

    document.getElementById("btnSendMessage").addEventListener("click", () => {
      const text = inputMessage.value.trim();
      if (!text) return;
      socket.emit("sendCafeteriaMessage", { text });
      if (navigator.vibrate) navigator.vibrate(30);
    });
    inputMessage.addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("btnSendMessage").click();
    });

    document.getElementById("btnShowSequence").addEventListener("click", () => {
      socket.emit("clearCafeteriaMessage");
      if (navigator.vibrate) navigator.vibrate(30);
    });

    document.getElementById("btnDing7").addEventListener("click", () => {
      socket.emit("dingSeven");
      if (navigator.vibrate) navigator.vibrate(30);
    });

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    socket.on("connect", () => {
      status.textContent = "Connected";
      status.className = "status connected";
    });
    socket.on("disconnect", () => {
      status.textContent = "Disconnected — retrying…";
      status.className = "status disconnected";
    });

    socket.on("state", (s) => {
      label.textContent = s.label;
      sublabel.textContent = s.sublabel || "";
      if (s.totalSeconds === 0) {
        timer.textContent = "—";
      } else {
        timer.textContent = formatTime(Math.max(0, s.secondsLeft));
      }
      const paused = s.paused ? " · PAUSED" : "";
      const msg = s.freeMessage ? " · MESSAGE SHOWING" : "";
      phase.textContent = `Phase ${s.phase} · Step ${s.currentIndex + 1}/${s.totalSteps}${paused}${msg}`;
    });
  </script>
</body>
</html>
