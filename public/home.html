<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cafeteria & Prayer Hall Management</title>

  <!-- Icons / app manifest -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Cafeteria" />
  <meta name="theme-color" content="#0f2a3a" />

  <!-- Open Graph / WhatsApp / social link preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Student Management System" />
  <meta property="og:description" content="Cafeteria and Prayer Hall management for our school" />
  <meta property="og:image" content="https://cafeteria-app-48aa.onrender.com/og-image.png" />
  <meta property="og:url" content="https://cafeteria-app-48aa.onrender.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Student Management System" />
  <meta name="twitter:description" content="Cafeteria and Prayer Hall management for our school" />
  <meta name="twitter:image" content="https://cafeteria-app-48aa.onrender.com/og-image.png" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f2a3a;
      color: #e6f4f7;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      gap: 24px;
    }

    .logo {
      width: 140px;
      height: 140px;
      margin-bottom: 8px;
      border-radius: 24px;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      text-align: center;
      color: #5dc1d1;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 18px;
      text-align: center;
      opacity: 0.75;
      margin-bottom: 16px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 520px;
    }

    .group {
      background: #1a4055;
      border-radius: 20px;
      padding: 20px;
      border: 1px solid #2a7d8f;
    }

    .group-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #5dc1d1;
      text-align: center;
      margin-bottom: 16px;
    }

    .group-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    a.button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px;
      border-radius: 14px;
      text-decoration: none;
      color: #e6f4f7;
      background: #2a7d8f;
      transition: transform 0.15s, background 0.2s;
      min-height: 130px;
      text-align: center;
    }

    a.button:hover, a.button:active {
      transform: scale(0.97);
      background: #5dc1d1;
      color: #0f2a3a;
    }

    a.button .icon {
      font-size: 46px;
      margin-bottom: 10px;
    }

    a.button .label {
      font-size: 20px;
      font-weight: 800;
    }

    .footer {
      font-size: 14px;
      opacity: 0.5;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div>
      <img src="/logo.png" alt="Logo" class="logo" />
      <h1>Student Management System</h1>
      <p class="subtitle">Choose a screen or controller</p>
    </div>

    <div class="menu">

      <div class="group">
        <div class="group-title">🍽️ Cafeteria</div>
        <div class="group-buttons">
          <a class="button" href="/cafeteria/screen">
            <div class="icon">📺</div>
            <div class="label">Screen</div>
          </a>
          <a class="button" href="/cafeteria/control">
            <div class="icon">📱</div>
            <div class="label">Control</div>
          </a>
        </div>
      </div>

      <div class="group">
        <div class="group-title">🕌 Prayer Hall</div>
        <div class="group-buttons">
          <a class="button" href="/prayer/screen">
            <div class="icon">📺</div>
            <div class="label">Screen</div>
          </a>
          <a class="button" href="/prayer/control">
            <div class="icon">📱</div>
            <div class="label">Control</div>
          </a>
        </div>
      </div>

    </div>

    <div class="footer">Tap any option to open it</div>
  </div>
</body>
</html>
